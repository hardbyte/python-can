name: Tests

on:
  release:
    types: [ published ]
  pull_request:
  push:
    branches-ignore:
      - 'dependabot/**'

env:
  PY_COLORS: "1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        env: [
          "py310",
          "py311",
          "py312",
          "py313",
          "py314",
#          "py313t",
#          "py314t",
          "pypy310",
          "pypy311",
        ]
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # 7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # 10.3.3
      with:
        enable-cache: false
    - name: Install tox
      run: uv tool install tox --with tox-uv
    - name: Setup SocketCAN
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        # Ubuntu 26.04 ships vcan in linux-modules, older releases need linux-modules-extra
        if ! modinfo vcan > /dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get -y install linux-modules-extra-$(uname -r)
        fi
        sudo ./test/open_vcan.sh
    - name: Test with pytest via tox
      run: |
        tox -e ${{ matrix.env }}
      env:
        # SocketCAN tests currently fail with PyPy because it does not support raw CAN sockets
        # See: https://github.com/pypy/pypy/issues/3808
        TEST_SOCKETCAN: "${{ matrix.os == 'ubuntu-latest' && ! startsWith(matrix.env, 'pypy' ) }}"
    - name: Coveralls Parallel
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # 2.3.8
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: Unittests-${{ matrix.os }}-${{ matrix.env }}
        parallel: true
        path-to-lcov: ./coverage.lcov

  coveralls:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # 7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Coveralls Finished
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # 2.3.8
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true

  static-code-analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # 7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # 10.3.3
      with:
        enable-cache: false
    - name: Install tox
      run: uv tool install tox --with tox-uv
    - name: Run linters
      run: |
        tox -e lint
    - name: Run type checker
      run: |
        tox -e type

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # 7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # 10.3.3
      with:
        enable-cache: false
    - name: Install tox
      run: uv tool install tox --with tox-uv
    - name: Build documentation
      run: |
        tox -e docs

  build:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # 7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # 10.3.3
        with:
          enable-cache: false
      - name: Build wheel and sdist
        run: uv build
      - name: Check build artifacts
        run: uvx twine check --strict dist/*
      - name: Save artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # 7.0.2
        with:
          name: release
          path: ./dist

  upload_pypi:
    needs: [build]
    name: Release to PyPi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write

    # upload to PyPI only on release
    if: github.event.release && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # 8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # 4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # 1.14.3
